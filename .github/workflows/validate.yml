name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/test-static.ps1
      - name: Validate with PowerShell 7
        shell: pwsh
        run: ./tests/test-static.ps1
      - name: Contract regression tests
        shell: pwsh
        run: node ./scripts/test-regression.mjs
      - name: Integrity and process lifecycle tests
        shell: pwsh
        run: node ./scripts/test-hardening.mjs
